name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
    # Run the complete migration on real runners before merging; no publication.
    branches: [ci/simplify-check-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or recover (run from main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify (${{ matrix.arch }})
    if: github.event.deleted != true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source and release version
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual release recovery must run from main.' >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            test "$SOURCE_SHA" = "$GITHUB_SHA"
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/release_metadata.py resolve --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          else
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"
            echo 'tag=' >> "$GITHUB_OUTPUT"
          fi
      - name: Select the supported native SDK
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Test release helpers
        if: matrix.arch == 'arm64'
        run: bash scripts/test-release-workflows.sh
      - name: Core tests
        if: matrix.arch == 'arm64'
        run: bash scripts/test-core.sh
      - name: Build production App once
        env:
          HUD_BUILD_ARCHS: ${{ matrix.arch }}
        run: bash scripts/build-app.sh
      - name: Native smoke tests
        run: bash scripts/test-core.sh --smoke
      - name: Package the built App
        env:
          HUD_PACKAGE_ARCH: ${{ matrix.arch }}
        run: bash scripts/package-dmg.sh
      - name: Record this run's artifact
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERSION: ${{ steps.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/release_metadata.py create \
            --source . --source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --arch "$ARCH" \
            --dmg "dist/GPT-TouchBar-HUD-$VERSION-$ARCH.dmg" \
            --output build/release-payload
      - name: Verify actual DMG and retained upgrade paths
        env:
          VERSION: ${{ steps.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/verify-package.sh --arch "$ARCH" \
            --dmg "build/release-payload/GPT-TouchBar-HUD-$VERSION-$ARCH.dmg" \
            --checksums build/release-payload/SHA256SUMS.txt \
            --output "build/package-verification/$ARCH"
      - name: Upload verified architecture payload
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.source.outputs.source_sha }}-${{ matrix.arch }}
          path: build/release-payload
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: Assemble and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download ARM payload from this run
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.source_sha }}-arm64
          path: downloads/arm64
      - name: Download Intel payload from this run
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.source_sha }}-x86_64
          path: downloads/x86_64
      - name: Verify, assemble and optionally publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          args=(--source . --source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY"
                --run-id "$GITHUB_RUN_ID" --artifacts downloads --output release-stage)
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]] ||
             [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]; then
            test -n "$RELEASE_TAG"
            args+=(--tag "$RELEASE_TAG" --publish)
          fi
          python3 scripts/publish-release.py "${args[@]}"
      - name: Keep migration validation output
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci/simplify-check-release'
        uses: actions/upload-artifact@v7
        with:
          name: validated-release-${{ needs.build.outputs.source_sha }}
          path: release-stage
          if-no-files-found: error
          overwrite: true
          retention-days: 7
