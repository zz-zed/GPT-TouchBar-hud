name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or recover (run from main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify (${{ matrix.arch }})
    if: github.event.deleted != true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Resolve source and release version
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual release recovery must run from main.' >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            test "$SOURCE_SHA" = "$GITHUB_SHA"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          depth_args=()
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            depth_args=(--unshallow)
          fi
          git fetch --no-tags "${depth_args[@]}" origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 scripts/release_metadata.py resolve --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
      - name: Check the exact release source and tag
        id: publication
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: python3 scripts/check-public-content.py --ref "refs/tags/$RELEASE_TAG" --exclude "$SOURCE_SHA"
      - name: Select the supported native SDK
        id: sdk
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Test release helpers
        id: helpers
        if: matrix.arch == 'arm64'
        run: bash scripts/test-release-workflows.sh
      - name: Core tests
        id: core
        if: matrix.arch == 'arm64'
        run: bash scripts/test-core.sh
      - name: Build production App once
        id: build
        env:
          HUD_BUILD_ARCHS: ${{ matrix.arch }}
        run: bash scripts/build-app.sh
      - name: Native smoke tests
        id: smoke
        run: bash scripts/test-core.sh --smoke
      - name: Package the built App
        id: package
        env:
          HUD_PACKAGE_ARCH: ${{ matrix.arch }}
        run: bash scripts/package-dmg.sh
      - name: Record this run's artifact
        id: metadata
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERSION: ${{ steps.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/release_metadata.py create \
            --source . --source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --arch "$ARCH" \
            --dmg "dist/GPT-TouchBar-HUD-$VERSION-$ARCH.dmg" \
            --output build/release-payload
      - name: Verify actual DMG and retained upgrade paths
        id: verify
        env:
          VERSION: ${{ steps.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/verify-package.sh --arch "$ARCH" \
            --dmg "build/release-payload/GPT-TouchBar-HUD-$VERSION-$ARCH.dmg" \
            --checksums build/release-payload/SHA256SUMS.txt \
            --output "build/package-verification/$ARCH"
      - name: Upload verified architecture payload
        id: payload
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.source.outputs.source_sha }}-${{ matrix.arch }}
          path: build/release-payload
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Summarize failure without raw evidence
        id: failure_summary
        if: failure()
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARCH: ${{ matrix.arch }}
          SOURCE: ${{ steps.source.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
          SDK: ${{ steps.sdk.outcome }}
          HELPERS: ${{ steps.helpers.outcome }}
          CORE: ${{ steps.core.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          METADATA: ${{ steps.metadata.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PAYLOAD: ${{ steps.payload.outcome }}
        run: |
          python3 scripts/public-failure-summary.py --version "$VERSION" --arch "$ARCH" \
            --source-sha "$SOURCE_SHA" --output build/public-failure-summary.json \
            --step "source=$SOURCE" --step "publication=$PUBLICATION" --step "sdk=$SDK" --step "helpers=$HELPERS" \
            --step "core=$CORE" --step "build=$BUILD" --step "smoke=$SMOKE" \
            --step "package=$PACKAGE" --step "metadata=$METADATA" \
            --step "verify=$VERIFY" --step "payload=$PAYLOAD"
          python3 scripts/check-public-content.py --payload build/public-failure-summary.json
      - name: Upload verification failure summary
        if: failure() && steps.failure_summary.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/public-failure-summary.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Assemble and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Download ARM payload from this run
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.source_sha }}-arm64
          path: downloads/arm64
      - name: Download Intel payload from this run
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.source_sha }}-x86_64
          path: downloads/x86_64
      - name: Verify, assemble and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          depth_args=()
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            depth_args=(--unshallow)
          fi
          git fetch --no-tags "${depth_args[@]}" origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python3 scripts/publish-release.py \
            --source . --source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --artifacts downloads --output release-stage \
            --tag "$RELEASE_TAG" --publish
