name: Isolated migration GUI feasibility
on:
  push:
    branches: [validation/gpt-hud-migration-gui-20261020]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Probe actual GUI session and isolated LaunchServices app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/validation/gpt-hud-migration-gui-20261020
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = "$ARCH"
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          mkdir -p evidence
          launchctl print "gui/$(id -u)" > evidence/gui-domain.log
          stat -f '%Su' /dev/console > evidence/console-user.log
          sw_vers > evidence/os.log
          ROOT="$(mktemp -d -t hud-gui-probe)"
          mkdir -p "$ROOT/GUI Probe.app/Contents/MacOS"
          APP="$ROOT/GUI Probe.app"
          cleanup() {
            /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -u "$APP" >/dev/null 2>&1 || true
            rm -rf "$ROOT"
          }
          trap cleanup EXIT
          cat > "$ROOT/probe.swift" <<'SWIFT'
          import AppKit
          import Darwin
          final class Delegate: NSObject, NSApplicationDelegate {
              func applicationDidFinishLaunching(_ notification: Notification) {
                  DispatchQueue.main.asyncAfter(deadline: .now() + 2) { NSApplication.shared.terminate(nil) }
              }
          }
          @main struct Probe {
              static func main() throws {
                  if CommandLine.arguments.count == 2, CommandLine.arguments[1] == "--child" {
                      let app = NSApplication.shared; let delegate = Delegate()
                      app.setActivationPolicy(.prohibited); app.delegate = delegate
                      withExtendedLifetime(delegate) { app.run() }; return
                  }
                  let url = URL(fileURLWithPath: CommandLine.arguments[1])
                  let config = NSWorkspace.OpenConfiguration(); config.arguments = ["--child"]
                  config.createsNewApplicationInstance = true; config.activates = false
                  var result: NSRunningApplication?; var failure: Error?; var completed = false
                  NSWorkspace.shared.openApplication(at: url, configuration: config) { app, error in
                      result = app; failure = error; completed = true
                  }
                  let deadline = Date().addingTimeInterval(15)
                  while !completed && Date() < deadline { RunLoop.current.run(until: Date().addingTimeInterval(0.02)) }
                  guard completed, failure == nil, let process = result, let date = process.launchDate,
                        process.bundleURL?.standardizedFileURL == url.standardizedFileURL,
                        process.executableURL?.path == url.appendingPathComponent("Contents/MacOS/HUDGUIProbe").path else {
                      throw NSError(domain: "GUIProbe", code: 1)
                  }
                  let record: [String: Any] = ["passed": true, "pid": process.processIdentifier,
                      "launchDate": date.timeIntervalSince1970, "bundleURL": process.bundleURL!.path,
                      "executableURL": process.executableURL!.path,
                      "method": "real NSWorkspace explicit URL and real NSApplication lifecycle"]
                  print(String(data: try JSONSerialization.data(withJSONObject: record, options: .sortedKeys), encoding: .utf8)!)
                  let stop = Date().addingTimeInterval(10)
                  while !process.isTerminated && Date() < stop { RunLoop.current.run(until: Date().addingTimeInterval(0.02)) }
                  guard process.isTerminated else { process.terminate(); throw NSError(domain: "GUIProbe", code: 2) }
              }
          }
          SWIFT
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>io.github.zz-zed.integration.gui.$GITHUB_RUN_ID.$ARCH</string>
          <key>CFBundleExecutable</key><string>HUDGUIProbe</string><key>CFBundlePackageType</key><string>APPL</string>
          <key>LSUIElement</key><true/></dict></plist>
          PLIST
          swiftc -parse-as-library "$ROOT/probe.swift" -o "$APP/Contents/MacOS/HUDGUIProbe"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/HUDGUIProbe" "$APP" > evidence/result.json
          cat evidence/result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-gui-feasibility-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          retention-days: 7
