name: Build macOS DMG

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Resources/**"
      - "scripts/**"
      - ".github/workflows/build-dmg.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Resources/**"
      - "scripts/**"
      - ".github/workflows/build-dmg.yml"

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ACTUAL_ARCH="$(uname -m)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ACTUAL_ARCH" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for $ACTUAL_ARCH"

      - name: Build and package DMG
        shell: bash
        run: |
          chmod +x scripts/build-app.sh scripts/package-dmg.sh
          scripts/package-dmg.sh

      - name: Verify app and DMG
        shell: bash
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"
          DMG_PATH="dist/TouchBarCodexToken-$VERSION.dmg"
          test -f "$DMG_PATH"
          codesign --verify --deep --strict build/TouchBarCodexToken.app
          hdiutil verify "$DMG_PATH"
          file build/TouchBarCodexToken.app/Contents/MacOS/TouchBarCodexToken

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: TouchBarCodexToken-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
