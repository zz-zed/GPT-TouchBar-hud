name: Build macOS DMG
run-name: Build DMG source ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character main ancestor SHA to rebuild (both architectures)
        required: true
        type: string
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.source_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Validate source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build_required: ${{ steps.source.outputs.build_required }}
      profile: ${{ steps.source.outputs.profile }}
      regression_matrix: ${{ steps.source.outputs.regression_matrix }}
      build_matrix: ${{ steps.source.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI tools and release refusal rules (offline, once)
        run: bash scripts/test-release-workflows.sh
      - name: Resolve immutable source (manual recovery only from main)
        id: source
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_FORCE_FULL_PR: ${{ vars.CI_FORCE_FULL_PR }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          SOURCE_SHA="$(python3 scripts/release_artifacts.py resolve-source)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          git cat-file -e "$SOURCE_SHA^{commit}"
          DIFF_AFTER="$SOURCE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            BEFORE_SHA="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")" || BEFORE_SHA=""
            DIFF_AFTER="$PR_HEAD_SHA"
          fi
          python3 scripts/ci_build_scope.py --event "$GITHUB_EVENT_NAME" \
            --before "$BEFORE_SHA" --after "$DIFF_AFTER" --github-output "$GITHUB_OUTPUT"

  regression:
    name: Regression (${{ matrix.arch }}, ${{ matrix.suite }})
    needs: source
    if: needs.source.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.regression_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      HUD_SHARED_UI_TESTS: ${{ vars.HUD_SHARED_UI_TESTS || '1' }}
      CI_TIMING_DIR: ${{ github.workspace }}/build/ci-timings/${{ matrix.arch }}-${{ matrix.suite }}
      CI_TIMING_SCRIPT: ${{ needs.source.outputs.sha == github.workflow_sha && 'scripts/ci_timing.py' || '.ci-tools/scripts/ci_timing.py' }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Check out timing tools for historical-source recovery
        if: needs.source.outputs.sha != github.workflow_sha
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false

      - name: Select Xcode with Liquid Glass SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Verify runner and source
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Initialize timing metadata
        run: python3 "$CI_TIMING_SCRIPT" init

      - name: Verify core-only and production build graphs
        if: matrix.suite == 'data'
        run: |
          if [[ -f Tests/CoreTestBuildGraphTests.py ]]; then
            python3 Tests/CoreTestBuildGraphTests.py
          else
            echo "Historical source predates the core-only build profile"
          fi

      - name: Test task status, account, quota, and host behavior
        if: matrix.suite == 'data'
        run: |
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-task-status -- bash scripts/test-task-status.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-hook-integration -- bash scripts/test-hook-integration.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-token-usage -- bash scripts/test-token-usage.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-task-reliability -- bash scripts/test-task-reliability.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-account-token-usage -- bash scripts/test-account-token-usage.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-verified-quota -- bash scripts/test-verified-quota.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-quota-alerts -- bash scripts/test-quota-alerts.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-host-auto-launcher -- bash scripts/test-host-auto-launcher.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-connection-diagnostics -- bash scripts/test-connection-diagnostics.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-diagnostic-logging -- bash scripts/test-diagnostic-logging.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-diagnostic-upgrade-storage -- bash scripts/test-diagnostic-upgrade-storage.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-diagnostic-upgrade-installer -- bash scripts/test-diagnostic-upgrade-installer.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-diagnostic-upgrade-recovery -- bash scripts/test-diagnostic-upgrade-recovery.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-host-lifecycle -- bash scripts/test-host-lifecycle.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-single-instance -- bash scripts/test-single-instance.sh

      - name: Test update policy and installer guards
        if: matrix.suite == 'data'
        run: |
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-app-update -- bash scripts/test-app-update.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-app-update-progress -- bash scripts/test-app-update-progress.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-github-release-fallback -- bash scripts/test-github-release-fallback.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-app-update-notifications -- bash scripts/test-app-update-notifications.sh

      - name: Test reset forecast runtime and cache migration
        if: matrix.suite == 'data'
        env:
          RESET_NEWS_CORE_DIR: ${{ runner.temp }}/reset-news-core-runtime-${{ matrix.arch }}
        run: python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-reset-news-runtime -- bash scripts/test-reset-news-runtime.sh

      - name: Verify HookCore and ResetNewsCore unit tests
        if: matrix.suite == 'data'
        run: python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-hooks -- bash scripts/test-hooks.sh

      - name: Test rendering, menu, and native presentation
        if: matrix.suite == 'interface'
        run: |
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-hud-material -- bash scripts/test-hud-material.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-idle-performance -- bash scripts/test-idle-performance.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-status-menu -- bash scripts/test-status-menu.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-notch-hud -- bash scripts/test-notch-hud.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-notch-presentation -- bash scripts/test-notch-presentation.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-touchbar -- bash scripts/test-touchbar.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-touchbar-layout -- bash scripts/test-touchbar-layout.sh
          python3 "$CI_TIMING_SCRIPT" run --phase suite --label test-design-layout -- bash scripts/test-design-layout.sh

      - name: Summarize timings (including failed tests)
        if: always()
        run: python3 "$CI_TIMING_SCRIPT" report

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-timings-${{ matrix.arch }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_TIMING_DIR }}
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.kind }} (${{ matrix.arch }})
    needs: source
    if: needs.source.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CI_TIMING_DIR: ${{ github.workspace }}/build/ci-timings/${{ matrix.arch }}-build
      CI_TIMING_SCRIPT: .release-tools/scripts/ci_timing.py

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Check out trusted workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - name: Select Xcode with Liquid Glass SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Read build metadata
        id: metadata
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ACTUAL_ARCH="$(uname -m)"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$ACTUAL_ARCH" != "$EXPECTED_ARCH" ]]; then
            echo "Expected runner architecture $EXPECTED_ARCH, got $ACTUAL_ARCH" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ACTUAL_ARCH" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for $ACTUAL_ARCH"

      - name: Initialize build timing metadata
        run: python3 "$CI_TIMING_SCRIPT" init

      - name: Build production App for standard PR
        if: matrix.kind == 'App'
        run: python3 "$CI_TIMING_SCRIPT" run --phase build --label build-app -- bash scripts/build-app.sh

      - name: Build and package DMG
        if: matrix.kind == 'DMG'
        id: package
        shell: bash
        run: |
          chmod +x scripts/build-app.sh scripts/package-dmg.sh
          python3 "$CI_TIMING_SCRIPT" run --phase package --label package-dmg -- bash scripts/package-dmg.sh
          VERSION="${{ steps.metadata.outputs.version }}"
          ARCH="${{ steps.metadata.outputs.arch }}"
          SOURCE_PATH="dist/GPT-TouchBar-HUD-$VERSION.dmg"
          ASSET_PATH="dist/GPT-TouchBar-HUD-$VERSION-$ARCH.dmg"
          mv "$SOURCE_PATH" "$ASSET_PATH"
          echo "dmg=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Test first-open helper with isolated app copy
        run: bash scripts/test-first-open.sh

      - name: Verify app signatures and architecture
        shell: bash
        run: |
          codesign --verify --deep --strict "build/GPT TouchBar HUD.app"
          codesign --verify --all-architectures --strict "build/GPT TouchBar HUD.app/Contents/Helpers/HookEmitter"
          lipo "build/GPT TouchBar HUD.app/Contents/Helpers/HookEmitter" -verify_arch "${{ steps.metadata.outputs.arch }}"
          lipo "build/GPT TouchBar HUD.app/Contents/MacOS/GPTTouchBarHUD" \
            -verify_arch "${{ steps.metadata.outputs.arch }}"

      - name: Verify DMG
        if: matrix.kind == 'DMG'
        env:
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: |
          test -f "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

      - name: Record immutable build provenance
        if: matrix.kind == 'DMG'
        id: provenance
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ARCH: ${{ matrix.arch }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: |
          OUTPUT="build/release-upload/$ARCH"
          mkdir -p "$OUTPUT"
          cp "$DMG_PATH" "$OUTPUT/"
          python3 .release-tools/scripts/release_artifacts.py create-manifest \
            --source . --output "$OUTPUT" --arch "$ARCH" \
            --repository "$GITHUB_REPOSITORY" --workflow-sha "$WORKFLOW_SHA"
          echo "name=release-$SOURCE_SHA-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload architecture DMG, checksum, and manifest
        if: matrix.kind == 'DMG'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.provenance.outputs.name }}
          path: ${{ steps.provenance.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Summarize build timings
        if: always()
        run: python3 "$CI_TIMING_SCRIPT" report

      - name: Upload build timing evidence separately from release payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-timings-${{ matrix.arch }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_TIMING_DIR }}
          if-no-files-found: error
          retention-days: 30

  gate:
    name: CI Gate
    needs: [source, regression, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out this workflow's immutable gate policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require every expected job in this run attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_PROFILE: ${{ needs.source.outputs.profile }}
        run: |
          python3 scripts/ci_gate.py --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --profile "$CI_PROFILE" --event "$GITHUB_EVENT_NAME" --head-sha "$GITHUB_SHA"
