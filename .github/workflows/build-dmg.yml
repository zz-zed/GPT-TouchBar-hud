name: Build macOS DMG

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Resources/**"
      - "scripts/**"
      - ".github/workflows/build-dmg.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Resources/**"
      - "scripts/**"
      - ".github/workflows/build-dmg.yml"

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read build metadata
        id: metadata
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ACTUAL_ARCH="$(uname -m)"
          RELEASE_TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ "$ACTUAL_ARCH" != "$EXPECTED_ARCH" ]]; then
            echo "Expected runner architecture $EXPECTED_ARCH, got $ACTUAL_ARCH" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ACTUAL_ARCH" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for $ACTUAL_ARCH"

      - name: Build and package DMG
        id: package
        shell: bash
        run: |
          chmod +x scripts/build-app.sh scripts/package-dmg.sh
          scripts/package-dmg.sh
          VERSION="${{ steps.metadata.outputs.version }}"
          ARCH="${{ steps.metadata.outputs.arch }}"
          SOURCE_PATH="dist/GPT-TouchBar-HUD-$VERSION.dmg"
          ASSET_PATH="dist/GPT-TouchBar-HUD-$VERSION-$ARCH.dmg"
          mv "$SOURCE_PATH" "$ASSET_PATH"
          echo "dmg=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify app and DMG
        shell: bash
        run: |
          DMG_PATH="${{ steps.package.outputs.dmg }}"
          test -f "$DMG_PATH"
          codesign --verify --deep --strict "build/GPT TouchBar HUD.app"
          hdiutil verify "$DMG_PATH"
          lipo "build/GPT TouchBar HUD.app/Contents/MacOS/GPTTouchBarHUD" \
            -verify_arch "${{ steps.metadata.outputs.arch }}"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: GPT-TouchBar-HUD-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.arch }}
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
          retention-days: 30

  publish-release-assets:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download architecture-specific DMGs
        uses: actions/download-artifact@v8
        with:
          pattern: GPT-TouchBar-HUD-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and create checksums
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          test -f "release-assets/GPT-TouchBar-HUD-$VERSION-arm64.dmg"
          test -f "release-assets/GPT-TouchBar-HUD-$VERSION-x86_64.dmg"
          cd release-assets
          sha256sum *.dmg > SHA256SUMS.txt

      - name: Create GitHub Release with installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IS_DRAFT="$(gh release view "$RELEASE_TAG" \
            --json isDraft \
            --jq '.isDraft' \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)"
          if [[ -z "$IS_DRAFT" ]]; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "GPT TouchBar HUD $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
            IS_DRAFT="true"
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/*.dmg \
            release-assets/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
          if [[ "$IS_DRAFT" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
