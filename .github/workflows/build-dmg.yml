name: Build macOS DMG
run-name: Build DMG source ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character main ancestor SHA to rebuild (both architectures)
        required: true
        type: string
  pull_request:
    branches:
      - main
    paths:
      - "Package.swift"
      - "Sources/**"
      - "HookCore/**"
      - "ResetNewsCore/**"
      - "HookHelper/**"
      - "Tests/**"
      - "Resources/**"
      - "scripts/**"
      - ".github/workflows/build-dmg.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.event_name }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build_required: ${{ steps.source.outputs.build_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable source (manual recovery only from main)
        id: source
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          SOURCE_SHA="$(python3 scripts/release_artifacts.py resolve-source)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            BUILD_REQUIRED="$(python3 scripts/ci_build_scope.py --before "$BEFORE_SHA" --after "$SOURCE_SHA")" || BUILD_REQUIRED=true
            [[ "$BUILD_REQUIRED" == true || "$BUILD_REQUIRED" == false ]] || BUILD_REQUIRED=true
          else
            BUILD_REQUIRED=true
          fi
          echo "build_required=$BUILD_REQUIRED" >> "$GITHUB_OUTPUT"

  regression:
    name: Regression (${{ matrix.arch }}, ${{ matrix.suite }})
    needs: source
    if: needs.source.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            suite: data
          - arch: arm64
            runner: macos-15
            suite: interface
          - arch: x86_64
            runner: macos-15-intel
            suite: data
          - arch: x86_64
            runner: macos-15-intel
            suite: interface
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Select Xcode with Liquid Glass SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Verify runner and source
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Test task status, account, quota, and host behavior
        if: matrix.suite == 'data'
        run: |
          bash scripts/test-task-status.sh
          bash scripts/test-hook-integration.sh
          bash scripts/test-token-usage.sh
          bash scripts/test-task-reliability.sh
          bash scripts/test-account-token-usage.sh
          bash scripts/test-verified-quota.sh
          bash scripts/test-quota-alerts.sh
          bash scripts/test-host-auto-launcher.sh
          bash scripts/test-connection-diagnostics.sh
          bash scripts/test-diagnostic-logging.sh
          bash scripts/test-diagnostic-upgrade-storage.sh
          bash scripts/test-diagnostic-upgrade-installer.sh
          bash scripts/test-diagnostic-upgrade-recovery.sh
          bash scripts/test-host-lifecycle.sh
          bash scripts/test-single-instance.sh

      - name: Test update policy and installer guards
        if: matrix.suite == 'data'
        run: |
          bash scripts/test-app-update.sh
          bash scripts/test-app-update-progress.sh
          bash scripts/test-github-release-fallback.sh
          bash scripts/test-app-update-notifications.sh

      - name: Test reset forecast runtime and cache migration
        if: matrix.suite == 'data'
        env:
          RESET_NEWS_CORE_DIR: ${{ runner.temp }}/reset-news-core-runtime-${{ matrix.arch }}
        run: bash scripts/test-reset-news-runtime.sh

      - name: Verify HookCore and ResetNewsCore unit tests
        if: matrix.suite == 'data'
        run: bash scripts/test-hooks.sh

      - name: Test rendering, menu, and native presentation
        if: matrix.suite == 'interface'
        run: |
          bash scripts/test-hud-material.sh
          bash scripts/test-idle-performance.sh
          bash scripts/test-status-menu.sh
          bash scripts/test-notch-hud.sh
          bash scripts/test-notch-presentation.sh
          bash scripts/test-touchbar.sh
          bash scripts/test-touchbar-layout.sh
          bash scripts/test-design-layout.sh

  build:
    name: Build DMG (${{ matrix.arch }})
    needs: source
    if: needs.source.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Check out trusted workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - name: Select Xcode with Liquid Glass SDK
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Read build metadata
        id: metadata
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ACTUAL_ARCH="$(uname -m)"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$ACTUAL_ARCH" != "$EXPECTED_ARCH" ]]; then
            echo "Expected runner architecture $EXPECTED_ARCH, got $ACTUAL_ARCH" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ACTUAL_ARCH" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for $ACTUAL_ARCH"

      - name: Test release provenance and refusal rules (offline)
        run: bash .release-tools/scripts/test-release-workflows.sh

      - name: Build and package DMG
        id: package
        shell: bash
        run: |
          chmod +x scripts/build-app.sh scripts/package-dmg.sh
          scripts/package-dmg.sh
          VERSION="${{ steps.metadata.outputs.version }}"
          ARCH="${{ steps.metadata.outputs.arch }}"
          SOURCE_PATH="dist/GPT-TouchBar-HUD-$VERSION.dmg"
          ASSET_PATH="dist/GPT-TouchBar-HUD-$VERSION-$ARCH.dmg"
          mv "$SOURCE_PATH" "$ASSET_PATH"
          echo "dmg=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Test first-open helper with isolated app copy
        run: bash scripts/test-first-open.sh

      - name: Verify app and DMG
        shell: bash
        run: |
          DMG_PATH="${{ steps.package.outputs.dmg }}"
          test -f "$DMG_PATH"
          codesign --verify --deep --strict "build/GPT TouchBar HUD.app"
          codesign --verify --all-architectures --strict "build/GPT TouchBar HUD.app/Contents/Helpers/HookEmitter"
          lipo "build/GPT TouchBar HUD.app/Contents/Helpers/HookEmitter" -verify_arch "${{ steps.metadata.outputs.arch }}"
          hdiutil verify "$DMG_PATH"
          lipo "build/GPT TouchBar HUD.app/Contents/MacOS/GPTTouchBarHUD" \
            -verify_arch "${{ steps.metadata.outputs.arch }}"

      - name: Record immutable build provenance
        id: provenance
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ARCH: ${{ matrix.arch }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: |
          OUTPUT="build/release-upload/$ARCH"
          mkdir -p "$OUTPUT"
          cp "$DMG_PATH" "$OUTPUT/"
          python3 .release-tools/scripts/release_artifacts.py create-manifest \
            --source . --output "$OUTPUT" --arch "$ARCH" \
            --repository "$GITHUB_REPOSITORY" --workflow-sha "$WORKFLOW_SHA"
          echo "name=release-$SOURCE_SHA-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload architecture DMG, checksum, and manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.provenance.outputs.name }}
          path: ${{ steps.provenance.outputs.path }}
          if-no-files-found: error
          retention-days: 30
