name: Build macOS DMG
run-name: Build DMG source ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character main ancestor SHA to rebuild (both architectures)
        required: true
        type: string
  pull_request:
    branches:
      - main
    paths:
      - "Package.swift"
      - "Sources/**"
      - "HookCore/**"
      - "ResetNewsCore/**"
      - "HookHelper/**"
      - "Tests/**"
      - "Resources/**"
      - "scripts/**"
      - ".github/workflows/build-dmg.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.event_name }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable source (manual recovery only from main)
        id: source
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          SOURCE_SHA="$(python3 scripts/release_artifacts.py resolve-source)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build DMG (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Check out trusted workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - name: Read build metadata
        id: metadata
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ACTUAL_ARCH="$(uname -m)"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$ACTUAL_ARCH" != "$EXPECTED_ARCH" ]]; then
            echo "Expected runner architecture $EXPECTED_ARCH, got $ACTUAL_ARCH" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ACTUAL_ARCH" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for $ACTUAL_ARCH"

      - name: Test release provenance and refusal rules (offline)
        run: bash .release-tools/scripts/test-release-workflows.sh

      - name: Test local task status parser
        run: bash scripts/test-task-status.sh

      - name: Test update policy and installer guards
        run: bash scripts/test-app-update.sh

      - name: Test reset forecast runtime and cache migration
        env:
          RESET_NEWS_CORE_DIR: ${{ runner.temp }}/reset-news-core-runtime-${{ matrix.arch }}
        run: bash scripts/test-reset-news-runtime.sh

      - name: Test independent Codex host lifecycle
        run: bash scripts/test-host-lifecycle.sh

      - name: Test notch HUD geometry, layout, and menu presentation
        run: bash scripts/test-notch-hud.sh

      - name: Test native island presentation and cancellation
        run: bash scripts/test-notch-presentation.sh

      - name: Build and package DMG
        id: package
        shell: bash
        run: |
          chmod +x scripts/build-app.sh scripts/package-dmg.sh
          scripts/package-dmg.sh
          VERSION="${{ steps.metadata.outputs.version }}"
          ARCH="${{ steps.metadata.outputs.arch }}"
          SOURCE_PATH="dist/GPT-TouchBar-HUD-$VERSION.dmg"
          ASSET_PATH="dist/GPT-TouchBar-HUD-$VERSION-$ARCH.dmg"
          mv "$SOURCE_PATH" "$ASSET_PATH"
          echo "dmg=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Test first-open helper with isolated app copy
        run: bash scripts/test-first-open.sh

      - name: Verify HookCore and ResetNewsCore unit tests
        shell: bash
        run: bash scripts/test-hooks.sh

      - name: Verify app and DMG
        shell: bash
        run: |
          DMG_PATH="${{ steps.package.outputs.dmg }}"
          test -f "$DMG_PATH"
          codesign --verify --deep --strict "build/GPT TouchBar HUD.app"
          codesign --verify --all-architectures --strict "build/GPT TouchBar HUD.app/Contents/Helpers/HookEmitter"
          lipo "build/GPT TouchBar HUD.app/Contents/Helpers/HookEmitter" -verify_arch "${{ steps.metadata.outputs.arch }}"
          hdiutil verify "$DMG_PATH"
          lipo "build/GPT TouchBar HUD.app/Contents/MacOS/GPTTouchBarHUD" \
            -verify_arch "${{ steps.metadata.outputs.arch }}"

      - name: Record immutable build provenance
        id: provenance
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ARCH: ${{ matrix.arch }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: |
          OUTPUT="build/release-upload/$ARCH"
          mkdir -p "$OUTPUT"
          cp "$DMG_PATH" "$OUTPUT/"
          python3 .release-tools/scripts/release_artifacts.py create-manifest \
            --source . --output "$OUTPUT" --arch "$ARCH" \
            --repository "$GITHUB_REPOSITORY" --workflow-sha "$WORKFLOW_SHA"
          echo "name=release-$SOURCE_SHA-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload architecture DMG, checksum, and manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.provenance.outputs.name }}
          path: ${{ steps.provenance.outputs.path }}
          if-no-files-found: error
          retention-days: 30
